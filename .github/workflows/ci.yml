name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: firstresponse
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed packages apps/api apps/app/lib apps/app/test

      - name: Validate rulebook
        working-directory: packages/core_rules
        run: dart run core_rules:rules validate

      # Includes every pack's golden cases; a broken one fails the merge.
      - name: Core tests
        working-directory: packages/core_rules
        run: |
          dart analyze --fatal-infos
          dart test

      - name: API tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/firstresponse?sslmode=disable
        run: |
          dart analyze --fatal-infos
          dart test

      - name: Bundle rules into the app
        working-directory: packages/core_rules
        run: dart run core_rules:rules bundle ../../apps/app/assets/rulebook.json

      - name: App tests
        working-directory: apps/app
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Web build
        working-directory: apps/app
        run: flutter build web
